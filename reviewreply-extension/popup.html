<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReviewReply AI</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- ─── Loading State ─── -->
      <div id="loading-state" class="state">
        <div class="logo">✨ ReviewReply AI</div>
        <p class="subtitle">Loading...</p>
      </div>

      <!-- ─── Logged Out State ─── -->
      <div id="logged-out-state" class="state hidden">
        <div class="logo">✨ ReviewReply AI</div>
        <p class="subtitle">AI-powered review replies for your business</p>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
            />
          </div>
          <div id="login-error" class="error hidden"></div>
          <button type="submit" id="login-btn" class="btn btn-primary">
            Log In
          </button>
        </form>

        <div class="divider"><span>or</span></div>

        <button id="google-login-btn" class="btn btn-google">
          <svg
            width="18"
            height="18"
            viewBox="0 0 48 48"
            style="vertical-align: middle; margin-right: 8px"
          >
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
          </svg>
          Sign in with Google
        </button>

        <p class="signup-link">
          Don't have an account?
          <a href="#" id="signup-link">Sign up</a>
        </p>
      </div>

      <!-- ─── Logged In State ─── -->
      <div id="logged-in-state" class="state hidden">
        <div class="header">
          <div class="logo-small">✨ ReviewReply AI</div>
          <button id="logout-btn" class="btn-icon" title="Log out">⏻</button>
        </div>

        <div class="welcome">
          <h2>Hello, <span id="user-name">there</span>!</h2>
          <span id="plan-badge" class="badge badge-free">FREE</span>
        </div>

        <div class="usage-section">
          <div class="usage-label">
            <span id="usage-text">0 of 10 generations used</span>
          </div>
          <div class="progress-bar">
            <div id="usage-fill" class="progress-fill" style="width: 0%"></div>
          </div>
        </div>

        <div class="actions">
          <button id="upgrade-btn" class="btn btn-upgrade hidden">
            ✨ Upgrade to Pro
          </button>
          <button id="manage-billing-btn" class="btn btn-secondary hidden">
            Manage Billing
          </button>
          <button id="settings-btn" class="btn btn-secondary">Settings</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
